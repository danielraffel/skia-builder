name: Build Failure Watchdog
run-name: Build Failure Watchdog

on:
  workflow_run:
    workflows: ["Build Skia"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: build-failure-watchdog-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout watchdog scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Optional: use a user or bot token if github-actions[bot] comments do
          # not trigger the connected Codex GitHub integration.
          token: ${{ secrets.CODEX_TRIGGER_TOKEN != '' && secrets.CODEX_TRIGGER_TOKEN || github.token }}

      - name: Report failure and request Codex
        env:
          GH_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN != '' && secrets.CODEX_TRIGGER_TOKEN || github.token }}
          RELEASE_REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: bash .github/scripts/report-build-failure.sh
