# build-skia-portable-linux.yml — portable Linux Skia+Dawn lane (glibc 2.35 floor).
#
# The default linux cell in build-skia.yml builds on ubuntu-latest (glibc ~2.39), and
# Skia's linux GN build links the system glibc (no sysroot), so the shipped libskia.a /
# libdawn_combined.a objects reference a too-new glibc. Consumers (e.g. Pulp) that link
# these then inherit a 2.39 floor. Building inside an Ubuntu 22.04 container lowers the
# floor to glibc ~2.34-2.35 — loadable on RHEL/Rocky 9+, Ubuntu 22.04+, Debian 12+,
# Fedora 35+ — matching the portable V8 lane (build-v8-portable-linux.yml).
#
# WHY 22.04 (not older): Skia is C++20; Debian 11 / Rocky 8 either lack a C++20 libstdc++
# or trip Chromium's bindgen. 22.04 (gcc-11) is the oldest clean C++20 base. Skia's own GN
# build uses the platform libstdc++ (like V8), so a lower base needs the same libc++/ABI
# tradeoffs V8 hit — 22.04 is the honest floor.
#
# FLOOR GATE: Skia ships STATIC .a archives, whose undefined glibc refs are unversioned
# until linked — so we can't objdump the floor off the .a directly. Instead we link a
# probe with --whole-archive over libskia.a + libdawn_combined.a (forcing every object in)
# and --unresolved-symbols=ignore-all (Skia's internal/system refs need not resolve), then
# objdump the probe's GLIBC version needs. The build-host glibc (22.04 = 2.35) is the hard
# guaranteed ceiling regardless; the probe is the precise measurement.
name: Build Skia (Ubuntu 22.04 / glibc 2.35 portable Linux)
run-name: Build Skia portable-linux ${{ inputs.skia_branch || 'chrome/m150' }}
on:
  workflow_dispatch:
    inputs:
      skia_branch:
        description: 'Skia branch/tag to build (must match the version Pulp pins for linux)'
        required: false
        default: 'chrome/m150'
        type: string
      max_glibc:
        description: 'Maximum acceptable glibc floor (Ubuntu 22.04 = 2.35)'
        required: false
        default: '2.35'
        type: string
      publish_tag:
        description: 'Release tag to upload skia-build-linux-x64-gpu-release.zip to (blank = build+validate only)'
        required: false
        type: string

env:
  LLVM_VERSION: "20.1.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.skia_branch || 'chrome/m150' }}
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  portable-linux-x64:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    # Plain bash (the `bash` shorthand adds -eo pipefail → `... | head` SIGPIPE-fails).
    defaults:
      run:
        shell: "bash {0}"
    env:
      SKIA_BRANCH: ${{ inputs.skia_branch || 'chrome/m150' }}
    steps:
      - name: Install Ubuntu 22.04 build deps (no sudo — container runs as root)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          # build-essential = C++20 gcc-11 toolchain (libstdc++ headers + GCC runtime) that
          # the link-probe and Skia's build need; the lib*-dev set is Skia's Linux GPU deps;
          # ninja-build + the rest are the build driver + LLVM download tooling.
          apt-get install -y --no-install-recommends \
            build-essential \
            git python3 python3-pip \
            curl ca-certificates file xz-utils bzip2 zip unzip tar \
            locales pkg-config binutils ninja-build ccache \
            libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libwayland-dev
          ln -sf /usr/bin/python3 /usr/local/bin/python || true
          python3 --version; ninja --version
          echo "system libstdc++ GLIBCXX:"; strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 \
            | grep -E '^GLIBCXX_3\.4\.(2[6-9]|3[0-9])' | sort -V | tail -1
      - name: Report build-host glibc (the guaranteed floor ceiling)
        run: |
          ldd --version | head -1
      - uses: actions/checkout@v6
      - name: Free disk space
        run: df -h / || true
      - name: Install LLVM and Clang ${{ env.LLVM_VERSION }} (Linux x64)
        run: |
          set -euo pipefail
          package="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${package}"
          install_dir="/opt/llvm-${LLVM_VERSION}"
          mkdir -p "$install_dir"
          curl -fsSL "$url" -o "/tmp/${package}"
          tar -xJf "/tmp/${package}" --strip-components=1 -C "$install_dir"
          echo "${install_dir}/bin" >> "$GITHUB_PATH"
          {
            echo "LLVM_PATH=${install_dir}"
            echo "CC=${install_dir}/bin/clang"
            echo "CXX=${install_dir}/bin/clang++"
            echo "LD_LIBRARY_PATH=${install_dir}/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          # Prove the downloaded clang RUNS on this 22.04 base (its own glibc need <= 2.35).
          "${install_dir}/bin/clang" --version
      - name: Build Skia + Dawn (GPU, Release) in Ubuntu 22.04
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          # depot_tools + build-skia.py clone into build/tmp; mark the workspace safe for git.
          # Use --system (/etc/gitconfig): git-sync-deps runs with depot_tools on PATH (its
          # own git shim) and a possibly different HOME, so --global config is not reliably
          # read. --system is honored by EVERY git invocation regardless of HOME/binary.
          # git-sync-deps does many parallel fetches from *.googlesource.com; HTTP/2 in the
          # container's git 2.34 yields "fatal: remote transport reported error". Force
          # HTTP/1.1 + a large post buffer (the standard googlesource-in-container fix).
          git config --system --add safe.directory '*'
          git config --system http.version HTTP/1.1
          git config --system http.postBuffer 524288000
          git config --global --add safe.directory '*'
          export PATH="/usr/lib/ccache:$PATH" || true
          python3 build-skia.py linux -variant gpu -config Release --shallow -branch "$SKIA_BRANCH"
      - name: Floor gate — link-probe glibc floor <= ${{ inputs.max_glibc || '2.35' }}
        run: |
          set -uo pipefail
          MAX="${{ inputs.max_glibc || '2.35' }}"
          SKIA_A="$(find build/linux-gpu -name libskia.a | head -1)"
          DAWN_A="$(find build/linux-gpu -name libdawn_combined.a | head -1)"
          echo "libskia.a: $SKIA_A"; echo "libdawn_combined.a: $DAWN_A"
          echo 'int main(void){return 0;}' > /tmp/probe.c
          # --whole-archive forces every Skia/Dawn object in; --unresolved-symbols=ignore-all
          # lets the probe link despite Skia-internal/system refs, so the exe's .gnu.version_r
          # records the true glibc floor of the archives.
          if clang++ /tmp/probe.c \
               -Wl,--whole-archive "$SKIA_A" "$DAWN_A" -Wl,--no-whole-archive \
               -Wl,--unresolved-symbols=ignore-all \
               -lstdc++ -lm -lpthread -ldl -o /tmp/probe 2>/tmp/probe.err; then
            echo "== link-probe glibc needs =="
            objdump -T /tmp/probe | grep -oE 'GLIBC_[0-9.]+' | sort -V | uniq -c
            HIGH="$(objdump -T /tmp/probe | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1 | sed 's/GLIBC_//')"
            echo "probe floor: ${HIGH:-none}"
          else
            echo "::warning::link-probe did not produce an exe; falling back to the build-host glibc ceiling."
            tail -5 /tmp/probe.err || true
            HIGH="$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')"
            echo "build-host glibc ceiling: ${HIGH}"
          fi
          # Assert floor <= MAX (version compare).
          python3 - "$HIGH" "$MAX" <<'PY'
          import sys
          def v(s): return tuple(int(x) for x in s.split('.'))
          high, mx = sys.argv[1], sys.argv[2]
          if not high:
              print("no glibc symbols found — vacuously OK"); sys.exit(0)
          if v(high) <= v(mx):
              print(f"[glibc-floor] OK — floor {high} <= {mx}")
          else:
              print(f"[glibc-floor] FAIL — floor {high} > {mx}", file=sys.stderr); sys.exit(1)
          PY
      - name: Package (skia-build-linux-x64-gpu-release.zip)
        id: pkg
        run: |
          set -euo pipefail
          ARCHIVE="skia-build-linux-x64-gpu-release.zip"
          zip -r "$ARCHIVE" build/include build/linux-gpu build/share
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -la "$ARCHIVE"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-build-linux-x64-gpu-release
          path: skia-build-linux-x64-gpu-release.zip
      - name: Publish to release
        if: ${{ inputs.publish_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.publish_tag }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" \
                 --notes "Portable Linux Skia+Dawn (${SKIA_BRANCH}, glibc <= 2.35 floor, built in Ubuntu 22.04). x64 GPU release; arm64 to follow."
          gh release upload "$TAG" skia-build-linux-x64-gpu-release.zip --repo "$GITHUB_REPOSITORY" --clobber
          echo "published skia-build-linux-x64-gpu-release.zip → $TAG"
