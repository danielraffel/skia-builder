name: Build Skia
run-name: Build Skia
on:
  # push:
  workflow_dispatch:
    inputs:
      skia_branch:
        description: 'Skia branch to build (e.g., chrome/m152)'
        required: false
        type: string
        default: 'chrome/m152'
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        required: false
        type: string
        default: 'all'
      test_mode:
        description: 'Run in test mode (skip Skia build)'
        required: false
        type: boolean
        default: false
      skip_release:
        description: 'Skip creating release (useful for testing single platforms)'
        required: false
        type: boolean
        default: false
      apple_runner:
        description: 'GitHub-hosted macOS runner label for Apple builds'
        required: false
        type: choice
        options:
          - macos-15
          - macos-15-intel
          - macos-14
        default: macos-15

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.skia_branch || 'chrome/m152' }}-${{ inputs.platforms || 'all' }}-${{ inputs.skip_release && 'skip-release' || 'release' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLVM_VERSION: "20.1.0"

permissions:
  contents: write

jobs:
  resolve-skia:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.lock.outputs.tag }}
      milestone: ${{ steps.lock.outputs.milestone }}
      skia: ${{ steps.lock.outputs.skia }}
      dawn: ${{ steps.lock.outputs.dawn }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve immutable Skia/Dawn release lock
        id: lock
        env:
          SKIA_BRANCH: ${{ inputs.skia_branch || 'chrome/m152' }}
        run: |
          python3 tools/skia_release_lock.py "$SKIA_BRANCH" \
            --output skia-release-lock.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable release lock
        uses: actions/upload-artifact@v7
        with:
          name: skia-release-lock
          path: skia-release-lock.json

  build-skia:
    needs: resolve-skia
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            variant: gpu
            arch: "universal"
          - os: macos-15
            platform: mac
            variant: gpu
            arch: "arm64"
          - os: macos-15
            platform: mac
            variant: gpu
            arch: "x86_64"
          - os: macos-15
            platform: ios
            variant: gpu
            arch: "arm64"
            target: "device"
          - os: macos-15
            platform: ios
            variant: gpu
            arch: "arm64,x86_64"
            target: "simulator"
          - os: macos-15
            platform: visionos
            variant: gpu
            arch: "arm64"
            target: "device"
          - os: macos-15
            platform: visionos
            variant: gpu
            arch: "arm64"
            target: "simulator"
          - os: windows-2022
            platform: win
            variant: gpu
            arch: x64
            config: Release
          - os: windows-2022
            platform: win
            variant: gpu
            arch: x64
            config: Debug
          # linux/x64 is built by the dedicated `portable-linux-x64` job below
          # (Ubuntu 22.04 container → glibc 2.34 floor). Building it here on
          # ubuntu-latest leaked glibc ~2.39 into libskia.a/libdawn_combined.a.
          - os: ubuntu-latest
            platform: wasm
            variant: gpu
            arch: "wasm32"
            config: Release

          # ARM64 platforms
          - os: ubuntu-24.04-arm
            platform: linux
            variant: gpu
            arch: arm64
          # - os: windows-11-arm
          #   platform: win
          #   variant: gpu
          #   arch: arm64
          # CPU variants
          # - os: macos-15
          #   platform: mac
          #   variant: cpu
          #   arch: ""
          # - os: windows-2022
          #   platform: win
          #   variant: cpu
          #   arch: x64
          # - os: ubuntu-24.04
          #   platform: linux
          #   variant: cpu
          #   arch: x64
          # - os: ubuntu-latest
          #   platform: wasm
          #   variant: cpu
          #   arch: ""
          # - os: macos-15
          #   platform: ios
          #   variant: cpu
          #   arch: ""
    runs-on: ${{ startsWith(matrix.os, 'macos') && (inputs.apple_runner || 'macos-15') || matrix.os }}
    env:
      SKIA_BRANCH: ${{ needs.resolve-skia.outputs.tag }}
      SKIA_REVISION: ${{ needs.resolve-skia.outputs.skia }}
    steps:
      - name: Check if platform should build
        id: check
        shell: bash
        run: |
          PLATFORMS="${{ inputs.platforms || 'all' }}"
          if [[ "$PLATFORMS" == "all" ]] || [[ "$PLATFORMS" == *"${{ matrix.platform }}"* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.platform }} (not in platforms: $PLATFORMS)"
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v6

      - name: Free disk space (Linux)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install Linux build dependencies
        if: steps.check.outputs.should_build == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libwayland-dev

      - name: Install Ninja
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          if command -v ninja >/dev/null 2>&1; then
            ninja --version
            exit 0
          fi

          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ninja-build
              ;;
            macOS)
              brew install ninja
              ;;
            Windows)
              choco install ninja --no-progress --yes
              printf '%s\n' 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
              export PATH="/c/ProgramData/chocolatey/bin:$PATH"
              ;;
          esac

          ninja --version

      - name: Set up Python
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set Git default branch
        if: steps.check.outputs.should_build == 'true'
        run: git config --global init.defaultBranch main

      - name: Install LLVM and Clang (Linux)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          case "${{ runner.arch }}" in
            X64) package_arch="Linux-X64" ;;
            ARM64) package_arch="Linux-ARM64" ;;
            *)
              echo "Unsupported Linux runner architecture: ${{ runner.arch }}" >&2
              exit 1
              ;;
          esac

          package="LLVM-${LLVM_VERSION}-${package_arch}.tar.xz"
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${package}"
          install_dir="${RUNNER_TOOL_CACHE}/llvm-${LLVM_VERSION}-${package_arch}"

          mkdir -p "$install_dir"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/${package}"
          tar -xJf "${RUNNER_TEMP}/${package}" --strip-components=1 -C "$install_dir"

          echo "${install_dir}/bin" >> "$GITHUB_PATH"
          {
            echo "LLVM_PATH=${install_dir}"
            echo "CC=${install_dir}/bin/clang"
            echo "CXX=${install_dir}/bin/clang++"
            echo "LD_LIBRARY_PATH=${install_dir}/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

          "${install_dir}/bin/clang" --version

      - name: Install LLVM and Clang (Windows x64)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Windows' && matrix.os != 'windows-11-arm'
        shell: pwsh
        run: |
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          $installerPath = "$env:RUNNER_TEMP\llvm-installer.exe"
          $llvmPath = "C:\Program Files\LLVM"
          $llvmBin = "$llvmPath\bin"

          Write-Host "Downloading LLVM installer..."
          Invoke-WebRequest -Uri $llvmUrl -OutFile $installerPath
          Write-Host "Installing LLVM silently..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Write-Host "LLVM installed successfully"

          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=$llvmBin\clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$llvmBin\clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & "$llvmBin\clang.exe" --version

      - name: Install LLVM and Clang (Windows ARM64)
        if: steps.check.outputs.should_build == 'true' && matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-woa64.exe"
          $installerPath = "$env:RUNNER_TEMP\llvm-installer.exe"
          $llvmPath = "C:\Program Files\LLVM"
          $llvmBin = "$llvmPath\bin"

          Write-Host "Downloading LLVM installer..."
          Invoke-WebRequest -Uri $llvmUrl -OutFile $installerPath
          Write-Host "Installing LLVM silently..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Write-Host "LLVM installed successfully"

          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=$llvmBin\clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$llvmBin\clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & "$llvmBin\clang.exe" --version

      - name: Set cache key arch
        if: steps.check.outputs.should_build == 'true'
        id: cache-key
        shell: bash
        run: |
          # Replace commas with dashes for cache key (commas not allowed)
          ARCH_SAFE=$(echo "${{ matrix.arch || 'default' }}" | tr ',' '-')
          echo "arch=${ARCH_SAFE}" >> "$GITHUB_OUTPUT"

      - name: Cache depot_tools and Skia source
        if: steps.check.outputs.should_build == 'true'
        uses: actions/cache@v5
        with:
          path: |
            build/tmp/depot_tools
            build/src/skia
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.arch }}-depot_tools-skia-${{ env.SKIA_BRANCH }}-${{ hashFiles('build-skia.py') }}

      - name: Set up ccache (build-skia.py auto-enables cc_wrapper when ccache is in PATH)
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ccache ;;
            macOS)   brew list ccache >/dev/null 2>&1 || brew install ccache ;;
            Windows) choco install ccache -y --no-progress ;;
          esac
          # skia-builder has MANY matrix cells (mac variants, win, linux, wasm, ios) and
          # already spends repo cache budget on the source cache, so keep ccache modest
          # (3G/cell) to stay under GitHub's 10G/repo LRU budget — the cell you iterate
          # stays warm; others evict harmlessly.
          {
            echo "CCACHE_DIR=$(pwd)/.ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"
      - name: Restore ccache (compiled objects — re-runs recompile only changed TUs)
        if: steps.check.outputs.should_build == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ steps.cache-key.outputs.arch }}-${{ matrix.platform }}-${{ matrix.variant }}-${{ env.SKIA_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.cache-key.outputs.arch }}-${{ matrix.platform }}-${{ matrix.variant }}-${{ env.SKIA_BRANCH }}-
            ccache-${{ runner.os }}-${{ steps.cache-key.outputs.arch }}-${{ matrix.platform }}-${{ matrix.variant }}-

      # - name: Build Skia (Debug)
      #   if: ${{ !inputs.test_mode }}
      #   run: |
      #     python3 build-skia.py ${{ matrix.platform }} -config Debug --shallow -branch ${{ env.SKIA_BRANCH }}

      - name: Build Skia (${{ matrix.config || 'Release' }})
        if: steps.check.outputs.should_build == 'true' && !inputs.test_mode
        shell: bash
        run: |
          CONFIG="${{ matrix.config || 'Release' }}"
          BUILD_ARGS=(build-skia.py "${{ matrix.platform }}" -variant "${{ matrix.variant }}" -config "$CONFIG" --shallow -branch "$SKIA_BRANCH" -revision "$SKIA_REVISION")
          if [ -n "${{ matrix.arch }}" ]; then
            BUILD_ARGS+=(-archs "${{ matrix.arch }}")
          fi
          if [ -n "${{ matrix.target }}" ]; then
            BUILD_ARGS+=(-target "${{ matrix.target }}")
          fi
          python3 "${BUILD_ARGS[@]}"

      - name: Set archive name
        if: steps.check.outputs.should_build == 'true'
        id: archive
        shell: bash
        run: |
          CONFIG="${{ matrix.config || 'Release' }}"
          CONFIG_LOWER=$(echo "$CONFIG" | tr '[:upper:]' '[:lower:]')
          # Build name components
          NAME="skia-build-${{ matrix.platform }}"
          # Add target (device/simulator) if specified
          if [ -n "${{ matrix.target }}" ]; then
            NAME="${NAME}-${{ matrix.target }}"
          fi
          # Add architecture if specified
          if [ -n "${{ matrix.arch }}" ]; then
            # Replace commas with dashes for multi-arch builds
            ARCH_SAFE=$(echo "${{ matrix.arch }}" | tr ',' '-')
            NAME="${NAME}-${ARCH_SAFE}"
          fi
          NAME="${NAME}-${{ matrix.variant }}-${CONFIG_LOWER}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Create dummy files for test mode
        if: steps.check.outputs.should_build == 'true' && inputs.test_mode
        shell: bash
        run: |
          mkdir -p build/include
          mkdir -p build/${{ matrix.platform }}-${{ matrix.variant }}
          echo "Test file" > build/include/test.h
          echo "Test lib" > build/${{ matrix.platform }}-${{ matrix.variant }}/test.lib
          echo "GN args summary" > build/${{ matrix.platform }}-${{ matrix.variant }}/gn_args.txt

      - name: Package binaries
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          # Include share directory if it exists (contains icudtl.dat for ICU)
          PACKAGE_PATHS=(build/include "build/${{ matrix.platform }}-${{ matrix.variant }}")
          if [ -d "build/share" ]; then
            PACKAGE_PATHS+=(build/share)
          fi
          ARCHIVE="${{ steps.archive.outputs.name }}.zip"
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip "$ARCHIVE" "${PACKAGE_PATHS[@]}"
          else
            zip -r "$ARCHIVE" "${PACKAGE_PATHS[@]}"
          fi

      - name: Upload artifact
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.zip

  # Portable Linux x64 Skia+Dawn, built in an Ubuntu 22.04 container so the shipped
  # libskia.a / libdawn_combined.a carry a glibc 2.34 floor (loadable on Ubuntu 22.04+,
  # Debian 12+, RHEL/Rocky 9+, Fedora 35+). The default ubuntu-latest matrix cell leaked
  # ~2.39. 22.04 (gcc-11) is the oldest clean C++20 base for Skia's GN build. This job
  # replaces the linux/x64 matrix cell and feeds the same `skia-build-linux-x64-gpu-release`
  # artifact that create-release publishes. (arm64 is still the leaky matrix cell — a
  # portable-linux-arm64 job is the tracked follow-up.)
  portable-linux-x64:
    needs: resolve-skia
    if: ${{ inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    # Plain bash (the `bash` shorthand adds -eo pipefail → `... | head` SIGPIPE-fails).
    defaults:
      run:
        shell: "bash {0}"
    env:
      SKIA_BRANCH: ${{ needs.resolve-skia.outputs.tag }}
      SKIA_REVISION: ${{ needs.resolve-skia.outputs.skia }}
    steps:
      - name: Install Ubuntu 22.04 build deps (no sudo — container runs as root)
        if: ${{ !inputs.test_mode }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gnupg software-properties-common
          # Ubuntu 22.04 ships git 2.34, whose HTTP/2 parallel-fetch bug makes Skia's
          # tools/git-sync-deps fail ("fatal: remote transport reported error") against
          # *.googlesource.com. depot_tools sets GIT_CONFIG_NOSYSTEM + its own HOME, so an
          # http.version=HTTP/1.1 override doesn't reach it. Upgrade git from the git-core
          # PPA (2.43+) instead — the bug is gone in the binary, no config needed.
          add-apt-repository -y ppa:git-core/ppa
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git python3 python3-pip \
            curl file xz-utils bzip2 zip unzip tar \
            locales pkg-config binutils ccache cmake \
            libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libwayland-dev
          # 22.04's apt ninja is 1.10.1, which lacks `ninja -t inputs` (added in 1.11) that
          # Skia's Dawn cmake_utils.py discover_dependencies calls. Install 1.12.1 ahead of
          # /usr/bin. ubuntu-latest ships 1.11+, which is why the original lane worked.
          curl -fsSL https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip -o /tmp/ninja.zip
          unzip -o /tmp/ninja.zip -d /usr/local/bin
          chmod +x /usr/local/bin/ninja
          ln -sf /usr/bin/python3 /usr/local/bin/python || true
          git --version; cmake --version | head -1; /usr/local/bin/ninja --version
      - name: Report build-host glibc (the guaranteed floor ceiling)
        if: ${{ !inputs.test_mode }}
        run: ldd --version | head -1
      - uses: actions/checkout@v6
      - name: Install LLVM and Clang ${{ env.LLVM_VERSION }} (Linux x64)
        if: ${{ !inputs.test_mode }}
        run: |
          set -euo pipefail
          package="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${package}"
          install_dir="/opt/llvm-${LLVM_VERSION}"
          mkdir -p "$install_dir"
          curl -fsSL "$url" -o "/tmp/${package}"
          tar -xJf "/tmp/${package}" --strip-components=1 -C "$install_dir"
          echo "${install_dir}/bin" >> "$GITHUB_PATH"
          {
            echo "LLVM_PATH=${install_dir}"
            echo "CC=${install_dir}/bin/clang"
            echo "CXX=${install_dir}/bin/clang++"
            echo "LD_LIBRARY_PATH=${install_dir}/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          "${install_dir}/bin/clang" --version
      - name: Build Skia + Dawn (GPU, Release) in Ubuntu 22.04
        if: ${{ !inputs.test_mode }}
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          # --system config is honored regardless of depot_tools' HOME/git shim; HTTP/1.1 +
          # large post buffer is the standard googlesource-in-container fix.
          git config --system --add safe.directory '*'
          git config --system http.version HTTP/1.1
          git config --system http.postBuffer 524288000
          git config --global --add safe.directory '*'
          export PATH="/usr/lib/ccache:$PATH" || true
          python3 build-skia.py linux -variant gpu -config Release --shallow \
            -branch "$SKIA_BRANCH" -revision "$SKIA_REVISION"
      - name: Floor gate — link-probe glibc floor <= 2.34
        if: ${{ !inputs.test_mode }}
        run: |
          set -uo pipefail
          SKIA_A="$(find build/linux-gpu -name libskia.a | head -1)"
          DAWN_A="$(find build/linux-gpu -name libdawn_combined.a | head -1)"
          echo "libskia.a: $SKIA_A"; echo "libdawn_combined.a: $DAWN_A"
          echo 'int main(void){return 0;}' > /tmp/probe.c
          # --whole-archive forces every Skia/Dawn object in; --unresolved-symbols=ignore-all
          # lets the probe link despite Skia-internal/system refs, so .gnu.version_r records
          # the true glibc floor of the archives (static .a undefined refs are unversioned).
          if clang++ /tmp/probe.c \
               -Wl,--whole-archive "$SKIA_A" "$DAWN_A" -Wl,--no-whole-archive \
               -Wl,--unresolved-symbols=ignore-all \
               -lstdc++ -lm -lpthread -ldl -o /tmp/probe 2>/tmp/probe.err; then
            objdump -T /tmp/probe | grep -oE 'GLIBC_[0-9.]+' | sort -V | uniq -c
            HIGH="$(objdump -T /tmp/probe | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1 | sed 's/GLIBC_//')"
          else
            echo "::warning::link-probe produced no exe; falling back to build-host glibc ceiling."
            tail -5 /tmp/probe.err || true
            HIGH="$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')"
          fi
          echo "probe floor: ${HIGH:-none}"
          python3 - "$HIGH" "2.34" <<'PY'
          import sys
          def v(s): return tuple(int(x) for x in s.split('.'))
          high, mx = sys.argv[1], sys.argv[2]
          if not high:
              print("no glibc symbols found — vacuously OK"); sys.exit(0)
          if v(high) <= v(mx):
              print(f"[glibc-floor] OK — floor {high} <= {mx}")
          else:
              print(f"[glibc-floor] FAIL — floor {high} > {mx}", file=sys.stderr); sys.exit(1)
          PY
      - name: Create dummy files for test mode
        if: ${{ inputs.test_mode }}
        run: |
          mkdir -p build/include build/linux-gpu
          echo "Test file" > build/include/test.h
          echo "Test lib" > build/linux-gpu/test.lib
          echo "GN args summary" > build/linux-gpu/gn_args.txt
      - name: Package (skia-build-linux-x64-gpu-release.zip)
        run: |
          set -euo pipefail
          PACKAGE_PATHS=(build/include build/linux-gpu)
          [ -d build/share ] && PACKAGE_PATHS+=(build/share)
          zip -r skia-build-linux-x64-gpu-release.zip "${PACKAGE_PATHS[@]}"
          ls -la skia-build-linux-x64-gpu-release.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skia-build-linux-x64-gpu-release
          path: skia-build-linux-x64-gpu-release.zip

  create-xcframework:
    needs: build-skia
    if: ${{ !inputs.skip_release && (inputs.platforms == 'all') }}
    runs-on: ${{ inputs.apple_runner || 'macos-15' }}
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-build-mac-universal-gpu-release

      - name: Download iOS device artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-build-ios-device-arm64-gpu-release

      - name: Download iOS simulator artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-build-ios-simulator-arm64-x86_64-gpu-release

      - name: Download visionOS device artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-build-visionos-device-arm64-gpu-release

      - name: Download visionOS simulator artifact
        uses: actions/download-artifact@v7
        with:
          name: skia-build-visionos-simulator-arm64-gpu-release

      - name: Extract artifacts
        run: |
          for zip in *.zip; do
            echo "Extracting $zip..."
            unzip -o "$zip"
          done
          echo "Build directory structure:"
          find build -name "libSkia.a" | head -20

      - name: Strip arm64e from libraries
        run: |
          # Strip arm64e slices to get cleaner XCFramework paths
          # (e.g., ios-arm64_x86_64-simulator instead of ios-arm64_arm64e_x86_64-simulator)
          strip_arm64e() {
            local lib="$1"
            if lipo -info "$lib" 2>/dev/null | grep -q "arm64e"; then
              echo "Stripping arm64e from $lib"
              lipo "$lib" -remove arm64e -output "${lib}.tmp"
              mv "${lib}.tmp" "$lib"
            fi
          }

          find build -name "libSkia.a" -print0 | while IFS= read -r -d '' lib; do
            strip_arm64e "$lib"
          done

      - name: Create XCFramework
        run: |
          # Merge iOS simulator architectures into a single fat library
          mkdir -p build/ios-gpu/lib/Release/simulator
          lipo -create \
            build/ios-gpu/lib/Release/simulator-arm64/libSkia.a \
            build/ios-gpu/lib/Release/simulator-x86_64/libSkia.a \
            -output build/ios-gpu/lib/Release/simulator/libSkia.a

          # Create XCFramework with headers only on one library (they'll be shared via symlinks)
          xcodebuild -create-xcframework \
            -library build/mac-gpu/lib/Release/libSkia.a \
            -headers build/include \
            -library build/ios-gpu/lib/Release/device-arm64/libSkia.a \
            -library build/ios-gpu/lib/Release/simulator/libSkia.a \
            -library build/visionos-gpu/lib/Release/device-arm64/libSkia.a \
            -library build/visionos-gpu/lib/Release/simulator-arm64/libSkia.a \
            -output Skia.xcframework

          # Move headers to root level and create symlinks to avoid duplication
          # Find the directory that has Headers (the one we specified -headers for)
          HEADERS_SRC=$(find Skia.xcframework -type d -name "Headers" | head -1)
          # Move headers to xcframework root
          mv "$HEADERS_SRC" Skia.xcframework/Headers

          # Create symlink in the original location
          ln -s ../Headers "$HEADERS_SRC"

          # Create symlinks for all other platform directories
          for dir in Skia.xcframework/*/; do
            dir=${dir%/}  # Remove trailing slash
            if [ -d "$dir" ] && [ ! -L "$dir/Headers" ] && [ ! -d "$dir/Headers" ]; then
              # Get relative path depth for symlink
              ln -s ../Headers "$dir/Headers"
            fi
          done

          echo "XCFramework structure:"
          find Skia.xcframework -type l -o -type d | head -30

      - name: Package XCFramework
        run: zip -ry Skia.xcframework.zip Skia.xcframework  # -y preserves symlinks

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: Skia.xcframework
          path: Skia.xcframework.zip

  create-release:
    if: ${{ !inputs.skip_release && inputs.platforms == 'all' }}
    needs: [resolve-skia, build-skia, create-xcframework, portable-linux-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Write release notes
        env:
          SKIA_RELEASE: ${{ needs.resolve-skia.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SKIA_RELEASE" =~ ^chrome/m([0-9]+)$ ]]
          milestone="${BASH_REMATCH[1]}"
          cat > release-notes.md <<EOF
          **Matched V8 release:** [V8 builds for M${milestone}](https://github.com/danielraffel/v8-builder/releases?q=v8-m${milestone})
          Use either release independently, or both as the matched Skia/Dawn/V8 toolchain.

          https://raw.githubusercontent.com/google/skia/${SKIA_RELEASE}/RELEASE_NOTES.md
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          tag_name: ${{ needs.resolve-skia.outputs.tag }}${{ inputs.test_mode && '-test' || '' }}
          name: ${{ needs.resolve-skia.outputs.tag }}${{ inputs.test_mode && ' (Test)' || '' }}
          draft: false
          prerelease: ${{ inputs.test_mode }}
          files: |
            ./skia-build-mac-universal-gpu-release/skia-build-mac-universal-gpu-release.zip
            ./skia-build-mac-arm64-gpu-release/skia-build-mac-arm64-gpu-release.zip
            ./skia-build-mac-x86_64-gpu-release/skia-build-mac-x86_64-gpu-release.zip
            ./skia-build-ios-device-arm64-gpu-release/skia-build-ios-device-arm64-gpu-release.zip
            ./skia-build-ios-simulator-arm64-x86_64-gpu-release/skia-build-ios-simulator-arm64-x86_64-gpu-release.zip
            ./skia-build-visionos-device-arm64-gpu-release/skia-build-visionos-device-arm64-gpu-release.zip
            ./skia-build-visionos-simulator-arm64-gpu-release/skia-build-visionos-simulator-arm64-gpu-release.zip
            ./skia-build-win-x64-gpu-release/skia-build-win-x64-gpu-release.zip
            ./skia-build-win-x64-gpu-debug/skia-build-win-x64-gpu-debug.zip
            ./skia-build-linux-x64-gpu-release/skia-build-linux-x64-gpu-release.zip
            ./skia-build-linux-arm64-gpu-release/skia-build-linux-arm64-gpu-release.zip
            ./skia-build-wasm-wasm32-gpu-release/skia-build-wasm-wasm32-gpu-release.zip
            ./Skia.xcframework/Skia.xcframework.zip
            ./skia-release-lock/skia-release-lock.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-matched-v8:
    if: ${{ !inputs.skip_release && inputs.platforms == 'all' && !inputs.test_mode }}
    needs: [resolve-skia, create-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger the matching milestone V8 release
        env:
          GH_TOKEN: ${{ secrets.V8_BUILDER_DISPATCH_TOKEN }}
          SKIA_RELEASE: ${{ needs.resolve-skia.outputs.tag }}
          BUILT_SKIA: ${{ needs.resolve-skia.outputs.skia }}
          BUILT_DAWN: ${{ needs.resolve-skia.outputs.dawn }}
        run: |
          set -euo pipefail
          [[ "$SKIA_RELEASE" =~ ^chrome/m([0-9]+)$ ]]
          milestone="${BASH_REMATCH[1]}"
          jq -n \
            --arg event_type skia_milestone_published \
            --arg milestone "$milestone" \
            --arg skia_release_tag "$SKIA_RELEASE" \
            --arg skia "$BUILT_SKIA" \
            --arg dawn "$BUILT_DAWN" \
            '{event_type: $event_type, client_payload: {
              milestone: $milestone,
              skia_release_tag: $skia_release_tag,
              skia: $skia,
              dawn: $dawn
            }}' | gh api --method POST repos/danielraffel/v8-builder/dispatches --input -
