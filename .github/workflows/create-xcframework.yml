name: Create XCFramework
run-name: Create XCFramework from ${{ inputs.release_tag }}
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to download artifacts from (e.g., chrome/m150)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload XCFramework to the release'
        required: false
        type: boolean
        default: true
      replace_reason:
        description: 'Deliberately replace a published Skia.xcframework.zip whose bytes differ; say why (recorded in the release notes). Leave empty to refuse any change.'
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-xcframework:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository (release asset guard)
        uses: actions/checkout@v6
        with:
          path: src

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo ${{ github.repository }} \
            --pattern "skia-build-mac-universal-gpu-release.zip" \
            --pattern "skia-build-ios-device-arm64-gpu-release.zip" \
            --pattern "skia-build-ios-simulator-arm64-x86_64-gpu-release.zip" \
            --pattern "skia-build-visionos-device-arm64-gpu-release.zip" \
            --pattern "skia-build-visionos-simulator-arm64-gpu-release.zip"

      - name: Extract artifacts
        run: |
          for zip in skia-build-*.zip; do
            echo "Extracting $zip..."
            unzip -o "$zip"
          done
          echo "Build directory structure:"
          find build -name "libSkia.a" | head -20

      - name: Strip arm64e from libraries
        run: |
          # Strip arm64e slices to get cleaner XCFramework paths
          # (e.g., ios-arm64_x86_64-simulator instead of ios-arm64_arm64e_x86_64-simulator)
          strip_arm64e() {
            local lib="$1"
            if lipo -info "$lib" 2>/dev/null | grep -q "arm64e"; then
              echo "Stripping arm64e from $lib"
              lipo "$lib" -remove arm64e -output "${lib}.tmp"
              mv "${lib}.tmp" "$lib"
            fi
          }

          find build -name "libSkia.a" -print0 | while IFS= read -r -d '' lib; do
            strip_arm64e "$lib"
          done

      - name: Create XCFramework
        run: |
          # Merge iOS simulator architectures into a single fat library
          mkdir -p build/ios-gpu/lib/Release/simulator
          lipo -create \
            build/ios-gpu/lib/Release/simulator-arm64/libSkia.a \
            build/ios-gpu/lib/Release/simulator-x86_64/libSkia.a \
            -output build/ios-gpu/lib/Release/simulator/libSkia.a

          # Create XCFramework with headers only on one library (they'll be shared via symlinks)
          xcodebuild -create-xcframework \
            -library build/mac-gpu/lib/Release/libSkia.a \
            -headers build/include \
            -library build/ios-gpu/lib/Release/device-arm64/libSkia.a \
            -library build/ios-gpu/lib/Release/simulator/libSkia.a \
            -library build/visionos-gpu/lib/Release/device-arm64/libSkia.a \
            -library build/visionos-gpu/lib/Release/simulator-arm64/libSkia.a \
            -output Skia.xcframework

          # Move headers to root level and create symlinks to avoid duplication
          # Find the directory that has Headers (the one we specified -headers for)
          HEADERS_SRC=$(find Skia.xcframework -type d -name "Headers" | head -1)
          # Move headers to xcframework root
          mv "$HEADERS_SRC" Skia.xcframework/Headers

          # Create symlink in the original location
          ln -s ../Headers "$HEADERS_SRC"

          # Create symlinks for all other platform directories
          for dir in Skia.xcframework/*/; do
            dir=${dir%/}  # Remove trailing slash
            if [ -d "$dir" ] && [ ! -L "$dir/Headers" ] && [ ! -d "$dir/Headers" ]; then
              # Get relative path depth for symlink
              ln -s ../Headers "$dir/Headers"
            fi
          done

          echo "XCFramework structure:"
          find Skia.xcframework -type l -o -type d | head -30

      - name: Package XCFramework
        run: zip -ry Skia.xcframework.zip Skia.xcframework  # -y preserves symlinks

      # Published assets are pinned by digest downstream, so a changed
      # XCFramework is refused unless replace_reason says why; an identical
      # re-run is a no-op.  See tools/release_asset_guard.py.
      - name: Upload XCFramework to release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_REASON: ${{ inputs.replace_reason }}
        run: |
          set -euo pipefail
          replace=()
          if [ -n "$REPLACE_REASON" ]; then
            replace=(--allow-replace Skia.xcframework.zip --reason "$REPLACE_REASON")
          fi
          python3 src/tools/release_asset_guard.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            publish Skia.xcframework.zip ${replace[@]+"${replace[@]}"} \
            --repin-hint "consumers pinning {tag}/{asset}: sha256 {old} -> {new}"

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: Skia.xcframework
          path: Skia.xcframework.zip
