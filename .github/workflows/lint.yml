name: Lint

# Guards that keep the release workflow self-consistent. Cheap, fast, and
# runs on every PR (and pushes) that touches the build workflow or the guard
# scripts themselves.
on:
  pull_request:
    paths:
      - '.github/workflows/build-skia.yml'
      - '.github/workflows/watch-skia.yml'
      - '.github/workflows/lint.yml'
      - 'patches/apply_dawn_ios_visionos.py'
      - 'patches/test_apply_dawn_ios_visionos.py'
      - 'tools/check_release_coverage.py'
      - 'tools/skia_release_lock.py'
      - 'tools/test_skia_release_lock.py'
      - 'tools/matched_v8_link.py'
      - 'tools/test_matched_v8_link.py'
      - '.github/workflows/create-xcframework.yml'
      - 'tools/release_asset_guard.py'
      - 'tools/test_release_asset_guard.py'
      - 'tools/check_windows_archive.py'
      - 'tools/test_check_windows_archive.py'
      - 'tools/write_windows_toolchain_provenance.py'
      - 'tools/test_windows_toolchain_provenance.py'
      - 'tools/testdata/**'
      - 'tools/requirements-lint.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-skia.yml'
      - '.github/workflows/watch-skia.yml'
      - '.github/workflows/lint.yml'
      - 'patches/apply_dawn_ios_visionos.py'
      - 'patches/test_apply_dawn_ios_visionos.py'
      - 'tools/check_release_coverage.py'
      - 'tools/skia_release_lock.py'
      - 'tools/test_skia_release_lock.py'
      - 'tools/matched_v8_link.py'
      - 'tools/test_matched_v8_link.py'
      - '.github/workflows/create-xcframework.yml'
      - 'tools/release_asset_guard.py'
      - 'tools/test_release_asset_guard.py'
      - 'tools/check_windows_archive.py'
      - 'tools/test_check_windows_archive.py'
      - 'tools/write_windows_toolchain_provenance.py'
      - 'tools/test_windows_toolchain_provenance.py'
      - 'tools/testdata/**'
      - 'tools/requirements-lint.txt'
  workflow_dispatch:

jobs:
  release-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install --require-hashes --no-deps -r tools/requirements-lint.txt
      # Every active build-matrix lane must be uploaded by create-release.
      # Catches the chrome/m150 regression: a lane built but never released.
      - run: python3 tools/check_release_coverage.py
      - run: python3 patches/test_apply_dawn_ios_visionos.py
      - run: python3 tools/test_skia_release_lock.py
      - run: python3 tools/test_matched_v8_link.py
      # Published assets are immutable unless deliberately replaced, and
      # Windows archives ship a provable toolchain receipt.
      - run: python3 tools/test_release_asset_guard.py
      - run: python3 tools/test_windows_toolchain_provenance.py
      - run: python3 tools/test_check_windows_archive.py
      - run: python3 -m py_compile build-skia.py tools/skia_release_lock.py tools/matched_v8_link.py tools/release_asset_guard.py tools/check_windows_archive.py tools/write_windows_toolchain_provenance.py
