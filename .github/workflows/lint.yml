name: Lint

# Guards that keep the release workflow self-consistent. Cheap, fast, and
# runs on every PR (it is a required check, so it must not be path-filtered)
# and on pushes that touch the build workflow or the guard scripts.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-skia.yml'
      - '.github/workflows/watch-skia.yml'
      - '.github/workflows/lint.yml'
      - 'patches/apply_dawn_macos_msl_version.py'
      - 'patches/test_apply_dawn_macos_msl_version.py'
      - 'patches/apply_dawn_ios_visionos.py'
      - 'patches/test_apply_dawn_ios_visionos.py'
      - 'patches/apply_dawn_windows_arm64_vector_stl.py'
      - 'patches/test_apply_dawn_windows_arm64_vector_stl.py'
      - 'tools/check_release_coverage.py'
      - 'tools/skia_matrix.json'
      - 'tools/skia_release_lock.py'
      - 'tools/test_skia_release_lock.py'
      - 'tools/matched_v8_link.py'
      - 'tools/test_matched_v8_link.py'
      - '.github/workflows/create-xcframework.yml'
      - 'tools/release_asset_guard.py'
      - 'tools/test_release_asset_guard.py'
      - 'tools/check_windows_archive.py'
      - 'tools/check_linux_archive.py'
      - 'tools/test_check_linux_archive.py'
      - 'tools/test_check_windows_archive.py'
      - 'tools/write_windows_toolchain_provenance.py'
      - 'tools/test_windows_toolchain_provenance.py'
      - 'tools/apple_archive.py'
      - 'tools/write_legal_manifest.py'
      - 'tools/write_apple_toolchain_receipt.py'
      - 'tools/compare_archive_members.py'
      - 'tools/test_apple_provenance.py'
      - 'tools/rebind_provenance.py'
      - 'tools/test_rebind_workflow.py'
      - 'tools/test_attest_subjects.py'
      - 'tools/write_linux_toolchain_receipt.py'
      - 'tools/stage_windows_receipt.py'
      - 'tools/archive_cell.py'
      - 'tools/check_attestation_bundle.py'
      - 'tools/test_check_attestation_bundle.py'
      - 'tools/test_native_provenance.py'
      - 'tools/release_tag.py'
      - 'tools/test_release_tag.py'
      - 'tools/test_patch_script_platforms.py'
      - 'tools/check_rebuild_run.py'
      - 'tools/prepare_apple_publication.py'
      - 'tools/test_prepare_apple_publication.py'
      - 'tools/testdata/**'
      - 'tools/requirements-lint.txt'
      - 'tools/test_lint_requirements.py'
      - 'tools/test_publish_ref_gate.py'
      - 'tools/test_release_path_gate.py'
      - 'tools/release_path_rule.py'
      - '.github/CODEOWNERS'
      - '.shipyard/config.toml'
      # Any workflow may gain release write access; the gate test reads them all.
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  release-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      # Wheels only: an sdist build would fetch setuptools/cython unpinned.
      - run: "pip install --only-binary :all: --require-hashes --no-deps -r tools/requirements-lint.txt"
      # Prove the sdist fallback is refused. Simulate a runner with no PyYAML
      # wheel (a FreeBSD platform tag) and even allow the sdist's hash: under
      # the install line's flags pip must find nothing, rather than build the
      # sdist and fetch its build dependencies unpinned.
      - name: Check the sdist fallback is refused
        run: |
          set -u
          { sed '$ s/$/ \\/' tools/requirements-lint.txt
            echo '    --hash=sha256:d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f'
          } > "$RUNNER_TEMP/with-sdist.txt"
          if pip install --dry-run --no-cache-dir --only-binary :all: --require-hashes --no-deps \
               --platform freebsd_14_0_amd64 --target "$RUNNER_TEMP/sdist-probe" \
               -r "$RUNNER_TEMP/with-sdist.txt" > "$RUNNER_TEMP/probe.log" 2>&1; then
            cat "$RUNNER_TEMP/probe.log"
            echo "::error::pip accepted PyYAML without a wheel under --only-binary :all:"
            exit 1
          fi
          grep -q "No matching distribution found for pyyaml" "$RUNNER_TEMP/probe.log" || {
            cat "$RUNNER_TEMP/probe.log"
            echo "::error::the probe failed for an unexpected reason"
            exit 1
          }
          echo "sdist fallback refused, as required"
      - run: python3 tools/test_lint_requirements.py
      # Every active build-matrix lane must be uploaded by create-release.
      # Catches the chrome/m150 regression: a lane built but never released.
      - run: python3 tools/check_release_coverage.py
      - run: python3 patches/test_apply_dawn_macos_msl_version.py
      - run: python3 patches/test_apply_dawn_ios_visionos.py
      - run: python3 patches/test_apply_dawn_windows_arm64_vector_stl.py
      - run: python3 tools/test_skia_release_lock.py
      - run: python3 tools/test_matched_v8_link.py
      - run: python3 tools/test_windows_arch_flags.py
      # Windows-only patch scripts must not change other platforms' archives.
      - run: python3 tools/test_patch_script_platforms.py
      # Published assets are immutable, and
      # Windows archives ship a provable toolchain receipt.
      - run: python3 tools/test_release_asset_guard.py
      - run: python3 tools/test_windows_toolchain_provenance.py
      - run: python3 tools/test_check_windows_archive.py
      # Linux archives must link without PartitionAlloc's BackupRefPtr.
      - run: python3 tools/test_check_linux_archive.py
      # Apple archives publish a legal manifest and toolchain receipt beside
      # them. The manifest test builds a small tree with real ninja.
      - run: sudo apt-get install -y -qq ninja-build
      - run: python3 tools/test_apple_provenance.py
      - run: python3 tools/test_rebind_workflow.py
      - run: python3 tools/test_prepare_apple_publication.py
      - run: python3 tools/test_attest_subjects.py
      # Linux and Windows archives publish the same records; the receipts and the
      # non-Mach-O archive reader are tested on fixtures.
      - run: python3 tools/test_native_provenance.py
      - run: python3 tools/test_check_attestation_bundle.py
      # A release_tag other than the branch tag must be the attested re-cut form.
      - run: python3 tools/test_release_tag.py
      # Only main may write to a release.
      - run: python3 tools/test_publish_ref_gate.py
      # The release-path gate's CODEOWNERS, workflow pin and reviewer policy.
      - run: python3 tools/test_release_path_gate.py
      # zizmor reports only: no step may be able to fail the job.
      - run: python3 tools/test_zizmor_report_only.py
      - run: python3 -m py_compile build-skia.py patches/apply_dawn_windows_arm64_vector_stl.py tools/skia_release_lock.py tools/matched_v8_link.py tools/release_asset_guard.py tools/check_windows_archive.py tools/check_linux_archive.py tools/write_windows_toolchain_provenance.py tools/apple_archive.py tools/write_legal_manifest.py tools/write_apple_toolchain_receipt.py tools/compare_archive_members.py tools/rebind_provenance.py tools/check_rebuild_run.py tools/write_linux_toolchain_receipt.py tools/stage_windows_receipt.py tools/archive_cell.py tools/check_attestation_bundle.py
