name: Publish verified Apple build
run-name: Publish ${{ inputs.asset }} from build ${{ inputs.build_run_id }}

# Reuse a completed main build, without rebuilding or trusting branch tools.
# This publishes the original signed records; it never rebinds provenance.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful main build-skia.yml run'
        required: true
        type: string
      build_run_attempt:
        description: 'Latest successful attempt of that run'
        required: true
        type: string
      release_tag:
        description: 'Existing destination milestone for a missing archive or identical retry'
        required: true
        type: string
      asset:
        description: 'Exactly one Apple archive to publish'
        required: true
        type: choice
        options:
          - skia-build-mac-universal-gpu-release.zip
          - skia-build-mac-arm64-gpu-release.zip
          - skia-build-mac-x86_64-gpu-release.zip
          - skia-build-ios-device-arm64-gpu-release.zip
          - skia-build-ios-simulator-arm64-x86_64-gpu-release.zip
          - skia-build-visionos-device-arm64-gpu-release.zip
          - skia-build-visionos-simulator-arm64-gpu-release.zip
      archive_sha256:
        description: 'Explicit expected SHA256 of the archive'
        required: true
        type: string

permissions:
  contents: read

# Serialize publication; do not cancel a publisher mid-upload.
concurrency:
  group: publish-verified-apple
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require a successful main build and its latest attempt
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          from prepare_apple_publication import ASSETS
          asset = os.environ["ASSET"]
          if asset not in ASSETS:
              raise ValueError("unsupported Apple asset")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("asset_stem=" + asset.removesuffix(".zip") + "\n")
          PY
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" > attempt.json
          python3 tools/check_rebuild_run.py run run.json attempt.json \
            --repository "$GITHUB_REPOSITORY" --attempt "$RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          name: ${{ steps.build.outputs.asset_stem }}
          path: rebuild/${{ steps.build.outputs.asset_stem }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          name: skia-build-apple-attestation
          path: rebuild/skia-build-apple-attestation
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          name: skia-release-lock
          path: rebuild/skia-release-lock
      - name: Bind the downloaded archive to the destination release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          RUN_ID: ${{ inputs.build_run_id }}
          RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run-after.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" > attempt-after.json
          python3 tools/check_rebuild_run.py same run.json run-after.json
          python3 tools/check_rebuild_run.py same attempt.json attempt-after.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern skia-release-lock.json --dir published
          python3 tools/prepare_apple_publication.py --root rebuild \
            --published-lock published/skia-release-lock.json --tag "$RELEASE_TAG" \
            --asset "$ASSET" --sha256 "$ARCHIVE_SHA256" --output staged
      - name: Verify the original hosted build attestation for every subject
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ inputs.asset }}
          RUN_ID: ${{ inputs.build_run_id }}
          RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          HEAD_SHA: ${{ steps.build.outputs.head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(staged/*.sigstore.json)
          [[ ${#bundles[@]} == 1 ]]
          subjects=("staged/$ASSET" staged/*.legal-manifest.sha256-*.json staged/*.apple-toolchain.sha256-*.json)
          [[ ${#subjects[@]} == 3 ]]
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" --bundle "${bundles[0]}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-skia.yml" \
              --source-ref refs/heads/main --source-digest "$HEAD_SHA" \
              --deny-self-hosted-runners --format json > verified.json
            python3 tools/check_rebuild_run.py invocation verified.json \
              --repository "$GITHUB_REPOSITORY" --run-id "$RUN_ID" \
              --attempt "$RUN_ATTEMPT" --head-sha "$HEAD_SHA"
          done
          python3 tools/write_legal_manifest.py staged/*.legal-manifest.sha256-*.json \
            --archive "staged/$ASSET" --check
          python3 tools/write_apple_toolchain_receipt.py staged/*.apple-toolchain.sha256-*.json \
            --archive "staged/$ASSET" --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-apple-publication
          path: staged/*
          if-no-files-found: error

  publish:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Never checkout the input build's commit in this privileged job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-apple-publication
          path: staged
      - name: Publish with the immutable asset guard
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          (cd staged && sha256sum --check SHA256SUMS)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern skia-release-lock.json --dir published
          cmp staged/skia-release-lock.json published/skia-release-lock.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > before.json
          python3 tools/release_asset_guard.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            publish staged/*.zip staged/*.json \
            --repin-hint 'Repin {asset} to sha256:{new} with its verified provenance records.'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > after.json
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from prepare_apple_publication import verify_published
          verify_published(json.loads(Path("before.json").read_text()),
                           json.loads(Path("after.json").read_text()), Path("staged"),
                           os.environ["ASSET"], "", None)
          print("PASS: published digests and preserved assets")
          PY
