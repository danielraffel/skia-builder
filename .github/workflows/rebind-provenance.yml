name: Rebind provenance
run-name: Rebind provenance for ${{ inputs.release_tag }} ${{ inputs.asset }}

# A release published before the builder wrote provenance can still get a
# legal manifest and toolchain receipt: rebuild it from main with the same
# source and toolchain (build-skia.yml with release_tag, apple_xcode and
# skip_release), then dispatch this workflow from main with that run. It
# accepts only a successful build-skia.yml run on refs/heads/main, takes the
# run's ref and attempt from the API, and verifies the run's own attest-apple
# bundle for the rebuild archive, manifest and receipt before rebinding them
# to the published archive with tools/rebind_provenance.py (which refuses
# unless the rebuild is member-identical). A branch run, whose tools could
# have been edited, can never be rebound. Run it while the rebuild run's
# artifacts still exist (90 days).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release holding the published archive (for example chrome/m157)'
        required: true
        type: string
      asset:
        description: 'Published archive (for example skia-build-mac-universal-gpu-release.zip)'
        required: true
        type: string
      rebuild_run_id:
        description: 'Successful build-skia.yml run on main that rebuilt the archive'
        required: true
        type: string
      rebuild_run_attempt:
        description: 'Attempt of that run; must be its latest, successful attempt'
        required: true
        type: string
      original_job:
        description: 'Job that built the published archive'
        required: true
        type: string
      original_image_version:
        description: 'Runner image version in that job log (for example 20260907.0337.1)'
        required: true
        type: string
      original_xcode:
        description: 'Xcode in that job log (for example Xcode_16.4)'
        required: true
        type: string
      original_compiler_identification:
        description: 'Compiler identification in that job log'
        required: true
        type: string
      publish:
        description: 'Add the rebound records and bundle to the release as new assets (main only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rebind:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      # Everything about the rebuild comes from the API, not from inputs.
      - name: Require a successful build-skia.yml run on main
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.rebuild_run_id }}
          RUN_ATTEMPT: ${{ inputs.rebuild_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]] || {
            echo "::error::rebuild_run_id and rebuild_run_attempt must be numbers"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" > attempt.json
          python3 tools/check_rebuild_run.py run run.json attempt.json \
            --repository "$GITHUB_REPOSITORY" --attempt "$RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Download the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir published
      - name: Download the rebuild
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.rebuild_run_id }}
          github-token: ${{ github.token }}
          path: rebuild
      # A rerun between the check and the download would replace the
      # artifacts; read the run again and require it unchanged.
      - name: Require the run unchanged after the download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.rebuild_run_id }}
          RUN_ATTEMPT: ${{ inputs.rebuild_run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run-after.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" > attempt-after.json
          python3 tools/check_rebuild_run.py same run.json run-after.json
          python3 tools/check_rebuild_run.py same attempt.json attempt-after.json
      # The rebuild's records are trusted only through the attestation its
      # own attest-apple job made on main, on a GitHub-hosted runner, in this
      # exact run attempt at this exact commit.
      - name: Verify the rebuild's build-provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ inputs.asset }}
          RUN_ID: ${{ inputs.rebuild_run_id }}
          RUN_ATTEMPT: ${{ inputs.rebuild_run_attempt }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          stem="${ASSET%.zip}"
          shopt -s nullglob
          bundles=(rebuild/skia-build-apple-attestation/"$stem".provenance-attestation.sha256-*.sigstore.json)
          if [ ${#bundles[@]} -ne 1 ]; then
            echo "::error::the rebuild run has no attestation bundle for $ASSET"
            exit 1
          fi
          for subject in "rebuild/$stem/$ASSET" rebuild/"$stem"/provenance-assets/*.json; do
            gh attestation verify "$subject" --bundle "${bundles[0]}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-skia.yml" \
              --source-ref refs/heads/main --source-digest "$HEAD_SHA" \
              --deny-self-hosted-runners --format json > verified.json
            python3 tools/check_rebuild_run.py invocation verified.json \
              --repository "$GITHUB_REPOSITORY" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" \
              --head-sha "$HEAD_SHA"
          done
      - name: Rebind the rebuild's records to the published archive
        env:
          ASSET: ${{ inputs.asset }}
          RUN_ID: ${{ inputs.rebuild_run_id }}
          RUN_ATTEMPT: ${{ inputs.rebuild_run_attempt }}
          REBUILD_REF: ${{ steps.run.outputs.ref }}
          REBUILD_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          ORIGINAL_JOB: ${{ inputs.original_job }}
          ORIGINAL_IMAGE: ${{ inputs.original_image_version }}
          ORIGINAL_XCODE: ${{ inputs.original_xcode }}
          ORIGINAL_COMPILER: ${{ inputs.original_compiler_identification }}
        run: |
          set -euo pipefail
          stem="${ASSET%.zip}"
          cell="rebuild/$stem"
          shopt -s nullglob
          manifests=("$cell"/provenance-assets/*.legal-manifest.sha256-*.json)
          receipts=("$cell"/provenance-assets/*.apple-toolchain.sha256-*.json)
          if [ ! -f "$cell/$ASSET" ] || [ ${#manifests[@]} -ne 1 ] || [ ${#receipts[@]} -ne 1 ]; then
            echo "::error::run $RUN_ID has no $ASSET with exactly one legal manifest and one toolchain receipt"
            exit 1
          fi
          # Exactly the one bundle the previous step verified.
          bundles=(rebuild/skia-build-apple-attestation/"$stem".provenance-attestation.sha256-*.sigstore.json)
          if [ ${#bundles[@]} -ne 1 ]; then
            echo "::error::the rebuild run has ${#bundles[@]} attestation bundles for $ASSET, not exactly one"
            exit 1
          fi
          python3 tools/rebind_provenance.py \
            --pinned "published/$ASSET" --rebuild-archive "$cell/$ASSET" \
            --rebuild-manifest "${manifests[0]}" --rebuild-receipt "${receipts[0]}" \
            --rebuild-bundle "${bundles[0]}" \
            --rebuild-repository "$GITHUB_REPOSITORY" --rebuild-run-id "$RUN_ID" \
            --rebuild-run-attempt "$RUN_ATTEMPT" --rebuild-ref "$REBUILD_REF" \
            --rebuild-head-sha "$REBUILD_HEAD_SHA" \
            --original-job "$ORIGINAL_JOB" --original-image-version "$ORIGINAL_IMAGE" \
            --original-xcode "$ORIGINAL_XCODE" --original-compiler-identification "$ORIGINAL_COMPILER" \
            --out-dir rebound
          python3 tools/write_legal_manifest.py rebound/*.legal-manifest.sha256-*.json \
            --archive "published/$ASSET" --check
          python3 tools/write_apple_toolchain_receipt.py rebound/*.apple-toolchain.sha256-*.json \
            --archive "published/$ASSET" --check
      - uses: actions/upload-artifact@v7
        with:
          name: rebound-provenance
          path: rebound/*.json
      # The rebuild archive, manifest, receipt and provenance bundle under the
      # content-addressed names derived_from records, so the derivation can be
      # re-verified from the release after the rebuild run's artifacts expire.
      - uses: actions/upload-artifact@v7
        with:
          name: rebuild-evidence
          path: rebound/evidence/*

  # Holds the OIDC grant; runs no third-party code and no build.
  attest:
    needs: rebind
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rebound-provenance
          path: rebound
      - name: Attest the rebound records
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: rebound/*.json
      - name: Keep the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "$BUNDLE" | cut -d' ' -f1)"
          cp "$BUNDLE" "rebound/${ASSET%.zip}.provenance-attestation.sha256-${digest}.sigstore.json"
          ls -la rebound
      - uses: actions/upload-artifact@v7
        with:
          name: rebound-provenance-attested
          path: rebound/*.json

  publish:
    needs: attest
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: rebound-provenance-attested
          path: rebound
      - uses: actions/download-artifact@v7
        with:
          name: rebuild-evidence
          path: evidence
      # Content-addressed names: these can only ever be new assets.
      - name: Add the rebound records and rebuild evidence to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 tools/release_asset_guard.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            publish rebound/*.json evidence/*
